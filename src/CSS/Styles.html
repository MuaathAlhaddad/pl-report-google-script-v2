<!doctype html>
<html>
  <head>
    <base target="_top" />

    <style>
      body {
        margin: 0;

        background: #f4f6f9;

        font-family: Arial, sans-serif;
      }

      #app {
        max-width: 1500px;

        margin: auto;

        padding: 25px;
      }

      .pageHeader {
        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 25px;
      }

      .summaryGrid {
        display: grid;

        grid-template-columns: repeat(3, 1fr);

        gap: 20px;

        margin-bottom: 30px;
      }

      .summaryCard {
        background: white;

        border-radius: 15px;

        padding: 25px;

        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      }

      .summaryCard .title {
        color: #777;

        font-size: 14px;
      }

      .summaryCard .value {
        font-size: 32px;

        margin-top: 10px;

        font-weight: bold;

        color: #1976d2;
      }

      .salesTable {
        width: 100%;

        border-collapse: collapse;

        background: white;

        border-radius: 15px;

        overflow: hidden;
      }

      .salesTable th {
        background: #1976d2;

        color: white;

        padding: 15px;
      }

      .salesTable td {
        padding: 12px;

        text-align: center;

        border-bottom: 1px solid #eee;
      }

      .salesTable tr:hover {
        background: #fafafa;
      }

      .newReportRow {
        cursor: pointer;

        background: #e8f5e9;

        font-weight: bold;
      }

      .newReportRow:hover {
        background: #c8e6c9;
      }

      .dashboardHeader {
        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 25px;
      }

      .dashboardHeader h1 {
        margin: 0;
      }

      #periodSelector {
        padding: 10px;

        border: 1px solid #ddd;

        border-radius: 8px;

        font-size: 15px;
      }

      .progress {
        margin-top: 12px;

        height: 8px;

        background: #eceff1;

        border-radius: 6px;

        overflow: hidden;
      }

      .progressFill {
        height: 100%;

        background: #43a047;
      }

      /* ---------- Sales Form ---------- */

      .formCard {
        background: white;

        padding: 30px;

        border-radius: 15px;

        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);

        max-width: 750px;

        margin: auto;
      }

      .formCard label {
        display: block;

        margin-top: 15px;

        margin-bottom: 6px;

        font-weight: bold;
      }

      .formCard input {
        width: 100%;

        box-sizing: border-box;

        padding: 12px;

        border: 1px solid #ddd;

        border-radius: 8px;

        font-size: 15px;
      }

      .formCard input:focus {
        outline: none;

        border-color: #1976d2;
      }

      .formCard button {
        padding: 12px 20px;

        border: none;

        border-radius: 8px;

        cursor: pointer;

        font-size: 15px;
      }

      .saveButton {
        width: 100%;

        margin-top: 25px;

        background: #2e7d32;

        color: white;
      }

      .saveButton:hover {
        background: #1b5e20;
      }

      .backButton {
        background: #757575;

        color: white;

        margin-bottom: 20px;
      }

      .backButton:hover {
        background: #616161;
      }

      /* ---------- Expense Cards ---------- */

      .expense-cards {
        display: flex;

        gap: 15px;

        margin: 15px 0;
      }

      .expense-card {
        flex: 1;

        background: white;

        border: 2px solid #ddd;

        border-radius: 12px;

        padding: 15px;

        cursor: pointer;

        transition: 0.2s;
      }

      .expense-card:hover {
        border-color: #1976d2;
      }

      .expense-card.selected {
        border-color: #2e7d32;

        background: #e8f5e9;
      }

      .expense-card .title {
        font-weight: bold;

        margin-bottom: 8px;
      }

      .expense-card .title span {
        float: right;

        color: #2e7d32;
      }

      .expense-card .hint {
        color: #666;

        font-size: 13px;

        line-height: 1.4;
      }

      /* ---------- Helpers ---------- */

      #paymentsTotal {
        margin-top: 8px;

        color: #555;

        font-size: 14px;
      }

      .formRow {
        display: flex;

        gap: 12px;

        align-items: center;
      }

      .formRow input {
        flex: 1;
      }

      /* ---------- progress bar ---------- */

      .progressContainer {
        position: relative;

        margin-top: 15px;
      }

      .progress {
        height: 8px;

        background: #eceff1;

        border-radius: 6px;

        overflow: hidden;
      }

      .progressFill {
        height: 100%;

        background: #43a047;
      }

      .progressLabel {
        position: absolute;

        top: -22px;

        transform: translateX(-50%);

        font-size: 12px;

        font-weight: bold;

        color: #43a047;

        white-space: nowrap;
      }

      .inputRow {
        display: flex;

        align-items: center;

        gap: 10px;

        width: 100%;
      }

      .inputRow input {
        flex: 1;

        width: auto;

        min-width: 0;

        margin: 0;
      }

      .inputRow button {
        width: 46px;

        height: 46px;

        flex: 0 0 46px;

        margin: 0;

        padding: 0;
      }
      .wizardProgress {
        margin-bottom: 25px;
      }

      .wizardProgressHeader {
        display: flex;

        justify-content: space-between;

        margin-bottom: 8px;

        font-weight: bold;
      }

      .expenseTotals {
        display: flex;

        justify-content: space-between;

        margin-top: 25px;

        padding: 20px;

        background: #f5f5f5;

        border-radius: 12px;

        font-size: 18px;

        font-weight: bold;
      }

      .expenseTotals span {
        color: #1976d2;
      }
      .formCard {
        background: white;

        border-radius: 16px;

        padding: 30px;

        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      }
      .expenseSection {
        margin-bottom: 35px;
      }

      .expenseSection h2 {
        margin: 0 0 18px;

        color: #1976d2;

        border-bottom: 2px solid #e3f2fd;

        padding-bottom: 8px;
      }

      .expenseRow {
        background: #fafafa;

        border: 1px solid #eeeeee;

        border-radius: 14px;

        padding: 18px;

        margin-bottom: 15px;
      }

      .expenseRow label {
        display: block;

        margin-bottom: 12px;

        font-weight: bold;

        color: #555;
      }

      .expenseRow input {
        width: 100%;

        box-sizing: border-box;

        padding: 14px;

        font-size: 17px;

        text-align: right;

        border-radius: 10px;

        border: 1px solid #ddd;
      }

      .wizardButtons {
        display: flex;

        justify-content: space-between;

        margin-top: 35px;
      }

      .wizardButtons button {
        padding: 14px 24px;

        border: none;

        border-radius: 10px;

        cursor: pointer;

        font-size: 15px;

        font-weight: bold;
      }
      #prevExpense {
        background: #eceff1;
      }
      #nextExpense {
        background: #1976d2;

        color: white;
      }
      #saveExpense {
        background: #43a047;

        color: white;
      }
    </style>
  </head>
  <body></body>
</html>
