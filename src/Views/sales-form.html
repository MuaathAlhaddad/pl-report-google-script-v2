<div id="salesFormPage" style="display: none">
    <div class="pageHeader">
        <h1 id="formTitle">New Sales Report</h1>
        <div class="pagePeriod" id="formPeriod"></div>
    </div>

    <div class="formCard">
        <label>Date</label>

        <div class="inputRow">
            <input type="date" id="date" />

            <button type="button" onclick="copyDateText(this)">📋</button>
        </div>

        <div class="sectionTitle">Cash</div>

        <div class="formRowGroup">
            <div class="formFieldGroup">
                <label>Starting Cash</label>
                <input type="number" id="startingCash" readonly />
            </div>

            <div class="formFieldGroup">
                <label>Closing Cash</label>
                <input type="number" id="cash" value="0" />
            </div>
        </div>

        <div class="sectionTitle">Daftra Numbers</div>

        <div class="formRowGroup">
            <div class="formFieldGroup">
                <label>Credit Invoices</label>

                <div class="editableField" data-field="creditInvoices">
                    <div
                        class="fieldDisplay"
                        ondblclick="editField('creditInvoices')"
                    >
                        <span class="fieldValue">0</span>
                        <span class="editHint">✎ edit</span>
                    </div>

                    <input
                        type="number"
                        id="creditInvoices"
                        value="0"
                        style="display: none"
                        onblur="doneEditingField('creditInvoices')"
                        onkeydown="if (event.key === 'Enter') { event.preventDefault(); this.blur(); }"
                    />
                </div>
            </div>

            <div class="formFieldGroup">
                <label>Customer Payments</label>

                <div class="editableField" data-field="customerPayments">
                    <div
                        class="fieldDisplay"
                        ondblclick="editField('customerPayments')"
                    >
                        <span class="fieldValue">0</span>
                        <span class="editHint">✎ edit</span>
                    </div>

                    <input
                        type="number"
                        id="customerPayments"
                        value="0"
                        style="display: none"
                        onblur="doneEditingField('customerPayments')"
                        onkeydown="if (event.key === 'Enter') { event.preventDefault(); this.blur(); }"
                    />
                </div>
            </div>
        </div>

        <label>Other Expenses</label>

        <div class="editableField" data-field="otherExpenses">
            <div class="fieldDisplay" ondblclick="editField('otherExpenses')">
                <span class="fieldValue">0</span>
                <span class="editHint">✎ from Daftra — double-click to edit</span>
            </div>

            <input
                type="number"
                id="otherExpenses"
                value="0"
                style="display: none"
                onblur="doneEditingField('otherExpenses')"
                onkeydown="if (event.key === 'Enter') { event.preventDefault(); this.blur(); }"
            />
        </div>

        <div class="sectionTitle">Supplier Payments</div>

        <label>Payments</label>

        <div class="inputRow">
            <input
                type="text"
                id="payments"
                placeholder="500+300+1200"
                oninput="updatePayments()"
            />

            <button type="button" onclick="copyPaymentsScript(this)">📋</button>
        </div>

        <div id="paymentsInfo"></div>

        <div class="sectionTitle">Daily Expense</div>

        <div class="expense-cards">
            <div
                class="expense-card selected"
                data-value="285"
                onclick="selectExpense(this, 285)"
            >
                <div class="title">
                    Normal Day

                    <span>285</span>
                </div>
            </div>

            <div
                class="expense-card"
                data-value="335"
                onclick="selectExpense(this, 335)"
            >
                <div class="title">
                    Heavy Day

                    <span>335</span>
                </div>
            </div>
        </div>

        <input type="hidden" id="dailyExpense" value="285" />

        <div class="sectionTitle">Cash Movements</div>

        <div class="formRowGroup">
            <div class="formFieldGroup">
                <label>Cash Withdrawal</label>

                <input
                    type="number"
                    id="cashWithdrawal"
                    value="0"
                    oninput="toggleNoteField('cashWithdrawal', 'withdrawalNoteGroup')"
                />
            </div>

            <div class="formFieldGroup">
                <label>Cash Deposit</label>

                <input
                    type="number"
                    id="cashDeposit"
                    value="0"
                    oninput="toggleNoteField('cashDeposit', 'depositNoteGroup')"
                />
            </div>
        </div>

        <div class="formRowGroup">
            <div class="formFieldGroup" id="withdrawalNoteGroup" style="display: none">
                <label>Withdrawal Note</label>

                <input
                    type="text"
                    id="withdrawalNote"
                    placeholder="Where did the money go? (optional)"
                />
            </div>

            <div class="formFieldGroup" id="depositNoteGroup" style="display: none">
                <label>Deposit Note</label>

                <input
                    type="text"
                    id="depositNote"
                    placeholder="Where did the money come from? (optional)"
                />
            </div>
        </div>

        <div class="buttonBar">
            <button type="button" onclick="showDashboard()">Cancel</button>

            <button id="saveButton" type="button" onclick="submitData()">
                Save Report
            </button>
        </div>
    </div>
</div>
