<!-- This is a fragment fetched on demand by loadDebtsPage() (JS/debts.js) and
     injected into the persistent #debtsPage placeholder in Index.html -- see
     JS/debts.js's header comment for why. Not wrapped in its own #debtsPage
     div; Index.html's placeholder already provides that (and its
     display:none default, toggled by router.js exactly like every other
     tab's container). -->

<!-- Login gate: shown until this device has a saved employee. -->
    <div id="debtsLogin" class="debtLoginWrap" style="display: none">
        <div class="debtLoginCard">
            <h1 class="debtLoginTitle">The Chase List</h1>
            <p class="debtLoginSub">Sign in to see who's due for a follow-up.</p>

            <label class="debtLoginLabel">Your name</label>
            <select id="debtsLoginName" class="debtLoginInput"></select>

            <label class="debtLoginLabel">PIN</label>
            <input type="password" id="debtsLoginPin" inputmode="numeric" placeholder="****" class="debtLoginInput" />

            <div id="debtsLoginError" style="display: none" class="debtLoginError"></div>

            <button type="button" class="debtBtn debtBtnDark debtLoginButton" onclick="debtsLogin()">
                Sign in
            </button>
        </div>
    </div>

    <!-- Main list: shown once logged in. -->
    <div id="debtsMain" style="display: none" class="debtApp">
        <div class="debtHeader">
            <div class="debtHeaderTop">
                <h1 class="debtTitle">The Chase List</h1>
                <div id="debtsSnapshotTime" class="debtSnapshotTime"></div>
            </div>

            <div class="debtHeaderRow">
                <button type="button" class="debtHeaderLink" onclick="debtsLogout()">
                    Sign out <span id="debtsWhoAmI"></span>
                </button>
                <div class="debtHeaderActions">
                    <button type="button" id="debtsReviewButton" class="debtHeaderLink" style="display: none" onclick="openDebtReview()">
                        Review <span id="debtsReviewBadge" class="debtCountBadge" style="display: none"></span>
                    </button>
                    <button type="button" id="debtsRefreshButton" class="debtHeaderLink" style="display: none" onclick="refreshDebts()">
                        Refresh from Daftra
                    </button>
                </div>
            </div>

            <div class="debtStatRow">
                <div>
                    <div class="debtStatLabel">Outstanding</div>
                    <div class="debtStatValue" id="debtsTotal">0</div>
                </div>
                <div id="debtsChaseToday" class="debtChaseTodayPill" style="display: none"></div>
            </div>
        </div>

        <div class="debtSearchBar">
            <input type="text" id="debtsSearch" placeholder="Search by name..." oninput="renderDebts()" />
        </div>

        <div id="debtsTypeToggle" class="debtTypeToggle">
            <button type="button" class="debtTypeOpt active" data-type="all" onclick="setDebtsTypeFilter('all')">All</button>
            <button type="button" class="debtTypeOpt" data-type="long" onclick="setDebtsTypeFilter('long')">Daftra</button>
            <button type="button" class="debtTypeOpt" data-type="short" onclick="setDebtsTypeFilter('short')">Notebook</button>
        </div>

        <div id="debtsTabs" class="debtTabsRow">
            <button type="button" class="debtTab active" data-tab="today" onclick="setDebtsTab('today')">Today <span class="debtTabCount">0</span></button>
            <button type="button" class="debtTab" data-tab="active" onclick="setDebtsTab('active')">Active <span class="debtTabCount">0</span></button>
            <button type="button" class="debtTab" data-tab="paid" onclick="setDebtsTab('paid')">Paid <span class="debtTabCount">0</span></button>
            <button type="button" class="debtTab" data-tab="dead" onclick="setDebtsTab('dead')">Dead debt <span class="debtTabCount">0</span></button>
        </div>

        <div id="debtsList" class="debtList"></div>
        <div id="debtsEmpty" class="emptyState" style="display: none"></div>

        <!-- Add Short Debt bottom sheet -->
        <div id="debtsAddShortForm" class="debtSheetOverlay" style="display: none" onclick="if(event.target===this) toggleAddShortForm()">
            <div class="debtSheet">
                <div class="debtSheetHead">
                    <h2>New debt to chase</h2>
                    <button type="button" class="debtSheetClose" onclick="toggleAddShortForm()">X</button>
                </div>

                <label class="debtLoginLabel">Who owes it</label>
                <input type="text" id="debtsNewName" class="debtLoginInput" placeholder="Debtor's name" />

                <label class="debtLoginLabel">Phone (for WhatsApp reminders)</label>
                <input type="text" id="debtsNewPhone" class="debtLoginInput" placeholder="+9665..." />

                <label class="debtLoginLabel">Amount owed</label>
                <input type="number" id="debtsNewAmount" class="debtLoginInput" placeholder="0" />

                <label class="debtLoginLabel">Date given</label>
                <input type="date" id="debtsNewDateGiven" class="debtLoginInput" />

                <label class="debtLoginLabel">Due date</label>
                <input type="date" id="debtsNewDueDate" class="debtLoginInput" />

                <label class="debtLoginLabel">Notes (optional)</label>
                <textarea id="debtsNewNotes" rows="2" class="debtLoginInput debtTextarea"></textarea>

                <div id="debtsAddShortError" style="display: none" class="debtLoginError"></div>

                <button type="button" class="debtBtn debtBtnDark debtLoginButton" onclick="submitShortDebt()">
                    Add to the list
                </button>
            </div>
        </div>

        <!-- Review checklist -->
        <div id="debtsReviewPanel" class="debtSheetOverlay" style="display: none" onclick="if(event.target===this) closeDebtReview()">
            <div class="debtSheet">
                <div class="debtSheetHead">
                    <h2>Review activity</h2>
                    <button type="button" class="debtSheetClose" onclick="closeDebtReview()">X</button>
                </div>
                <p class="debtSheetHint">Everything the team has recorded, newest first. Tap to check it off.</p>
                <div id="debtsReviewList" class="debtReviewList"></div>
            </div>
        </div>

        <button type="button" id="debtsAddButton" class="fab" style="display: none" onclick="toggleAddShortForm()">+</button>
    </div>
